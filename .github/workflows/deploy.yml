name: Deploy to Production

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Bundle with esbuild
        run: |
          npx esbuild server.js --bundle --platform=node --outfile=dist/server.js --minify

      - name: Download portable Node.js for Windows x86
        run: |
          curl -L -o node.zip https://nodejs.org/dist/v20.18.3/node-v20.18.3-win-x86.zip
          unzip -q node.zip
          mv node-v20.18.3-win-x86 node-portable

      - name: Prepare publish directory
        run: |
          mkdir -p ./publish/public ./publish/iisnode
          cp dist/server.js ./publish/
          cp web.config node-wrapper.cmd ./publish/
          cp -r public/* ./publish/public/
          cp node-portable/node.exe ./publish/
          echo "Total files: $(find ./publish -type f | wc -l)"
          echo "Total size: $(du -sh ./publish | cut -f1)"

      - name: Generate Production Config
        env:
          DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
          ADMIN_PW: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PW: ${{ secrets.SMTP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GH_TOKEN_APP: ${{ secrets.GH_TOKEN_APP }}
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
          WEBAUTHN_RP_ID: ${{ secrets.WEBAUTHN_RP_ID }}
          WEBAUTHN_RP_NAME: ${{ secrets.WEBAUTHN_RP_NAME }}
          WEBAUTHN_ORIGIN: ${{ secrets.WEBAUTHN_ORIGIN }}
        run: |
          jq -n \
            --arg db "$DB_CONN" \
            --arg admin "$ADMIN_PW" \
            --arg smtpHost "$SMTP_HOST" \
            --arg smtpUser "$SMTP_USER" \
            --arg smtpPw "$SMTP_PW" \
            --arg sessionSecret "$SESSION_SECRET" \
            --arg ghToken "$GH_TOKEN_APP" \
            --arg ghOwner "${GH_OWNER:-surendiransithamparam}" \
            --arg ghRepo "${GH_REPO:-HaushaltPLUS}" \
            --arg waRpId "${WEBAUTHN_RP_ID:-localhost}" \
            --arg waRpName "${WEBAUTHN_RP_NAME:-HaushaltPLUS}" \
            --arg waOrigin "${WEBAUTHN_ORIGIN:-http://localhost:3000}" \
            '{
              connectionString: $db,
              adminPassword: $admin,
              sessionSecret: $sessionSecret,
              smtp: {
                host: $smtpHost,
                port: 587,
                user: $smtpUser,
                password: $smtpPw,
                from: $smtpUser,
                fromName: "HaushaltPLUS"
              },
              github: {
                token: $ghToken,
                owner: $ghOwner,
                repo: $ghRepo
              },
              webauthn: {
                rpId: $waRpId,
                rpName: $waRpName,
                origin: $waOrigin
              }
            }' > ./publish/config.json

      - name: Upload app_offline.htm
        run: |
          curl -s -T - -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}/subdomains/einkaufsliste/httpdocs/app_offline.htm" \
            <<< '<html><body><h1>Update in progress...</h1></body></html>'

      - name: Wait for IIS to release files
        run: sleep 15

      - name: Deploy via FTP (lftp mirror)
        run: |
          sudo apt-get install -y -qq lftp > /dev/null 2>&1
          # First deploy everything except node.exe
          lftp -c "
            set ftp:ssl-allow no;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }};
            mirror --reverse --delete --verbose --no-perms \
              --exclude node.exe \
              ./publish/ /subdomains/einkaufsliste/httpdocs/;
            bye
          "
          # Upload node.exe with retries (IIS may still hold a lock)
          for i in 1 2 3 4 5; do
            echo "Uploading node.exe (attempt $i)..."
            if lftp -c "
              set ftp:ssl-allow no;
              open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }};
              put ./publish/node.exe -o /subdomains/einkaufsliste/httpdocs/node.exe;
              bye
            "; then
              echo "node.exe uploaded successfully"
              break
            fi
            echo "Retrying in 10s..."
            sleep 10
          done

      - name: Remove app_offline.htm to restart IIS
        run: |
          curl -s -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}" \
            -Q "DELE /subdomains/einkaufsliste/httpdocs/app_offline.htm" || true
