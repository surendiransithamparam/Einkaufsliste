name: Deploy to Production

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish Einkaufsliste/Einkaufsliste.csproj -c Release -o ./publish

      - name: Generate Production Config
        env:
          DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
          ADMIN_PW: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PW: ${{ secrets.SMTP_PASSWORD }}
        run: |
          jq -n \
            --arg db "$DB_CONN" \
            --arg admin "$ADMIN_PW" \
            --arg smtpHost "$SMTP_HOST" \
            --arg smtpUser "$SMTP_USER" \
            --arg smtpPw "$SMTP_PW" \
            '{
              ConnectionStrings: { Default: $db },
              AdminPassword: $admin,
              Smtp: {
                Host: $smtpHost,
                Port: 587,
                User: $smtpUser,
                Password: $smtpPw,
                From: $smtpUser,
                FromName: "Einkaufsliste"
              }
            }' > ./publish/appsettings.Production.json

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /subdomains/einkaufsliste/httpdocs/
