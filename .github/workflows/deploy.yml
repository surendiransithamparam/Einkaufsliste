name: Deploy to Production

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --production

      - name: Download portable Node.js for Windows x86
        run: |
          curl -L -o node.zip https://nodejs.org/dist/v20.18.3/node-v20.18.3-win-x86.zip
          unzip -q node.zip
          mv node-v20.18.3-win-x86 node-portable

      - name: Prepare publish directory
        run: |
          mkdir -p ./publish/public ./publish/logs ./publish/iisnode
          cp server.js package.json package-lock.json web.config ./publish/
          cp -r node_modules ./publish/
          cp -r public/* ./publish/public/
          cp node-portable/node.exe ./publish/

      - name: Generate Production Config
        env:
          DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
          ADMIN_PW: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PW: ${{ secrets.SMTP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          jq -n \
            --arg db "$DB_CONN" \
            --arg admin "$ADMIN_PW" \
            --arg smtpHost "$SMTP_HOST" \
            --arg smtpUser "$SMTP_USER" \
            --arg smtpPw "$SMTP_PW" \
            --arg sessionSecret "$SESSION_SECRET" \
            '{
              connectionString: $db,
              adminPassword: $admin,
              sessionSecret: $sessionSecret,
              smtp: {
                host: $smtpHost,
                port: 587,
                user: $smtpUser,
                password: $smtpPw,
                from: $smtpUser,
                fromName: "Einkaufsliste"
              }
            }' > ./publish/config.json

      - name: Create app_offline.htm
        run: |
          mkdir -p ./app_offline
          echo '<html><body><h1>Update in progress...</h1></body></html>' > ./app_offline/app_offline.htm

      - name: Upload app_offline.htm to stop IIS
        uses: sebastianpopp/ftp-action@v2.0.0
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: ./app_offline/
          remoteDir: /subdomains/einkaufsliste/httpdocs/

      - name: Wait for IIS to release files
        run: sleep 5

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /subdomains/einkaufsliste/httpdocs/

      - name: Remove app_offline.htm to restart IIS
        run: |
          curl -s --ftp-create-dirs \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}/subdomains/einkaufsliste/httpdocs/" \
            -Q "DELE /subdomains/einkaufsliste/httpdocs/app_offline.htm"
