<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Haushalt+</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="wochenplan.css">
    <style>
        .recipe-card {
            background: var(--surface);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: box-shadow 0.15s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .recipe-card:hover { box-shadow: var(--shadow-md); }
        .recipe-card a:hover { color: var(--green-600); }
        .recipe-card .source-badge {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--gray-400);
            background: var(--gray-100);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            white-space: nowrap;
        }
        .recipe-grid { display: flex; flex-direction: column; gap: 0.5rem; }
        .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .search-box input { flex: 1; }
        .day-picker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; margin-bottom: 0.75rem; }
        .day-pick-btn {
            padding: 0.4rem 0.2rem;
            border: 1.5px solid var(--gray-200);
            border-radius: 6px;
            background: var(--surface);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--gray-500);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .day-pick-btn:hover { border-color: var(--green-600); color: var(--green-600); }
        .day-pick-btn.selected { background: var(--green-600); color: white; border-color: var(--green-600); }
        .day-pick-btn .day-date { font-size: 0.6rem; font-weight: 400; display: block; }
        .meal-pick { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .meal-pick-btn {
            flex: 1;
            padding: 0.5rem;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            background: var(--surface);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray-500);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .meal-pick-btn:hover { border-color: var(--green-600); color: var(--green-600); }
        .meal-pick-btn.selected { background: var(--green-600); color: white; border-color: var(--green-600); }
    </style>
</head>
<body>

<nav id="navbar"></nav>
<aside id="sidebar"></aside>

<div id="appContent" class="app-content hidden">
<div class="container">
    <div class="search-box">
        <input type="text" id="rezeptSuche" placeholder="Rezept suchen…" onkeydown="if(event.key==='Enter')searchRecipes()">
        <button class="btn btn-primary" onclick="searchRecipes()" style="white-space:nowrap">
            <i class="bi bi-search"></i> Suchen
        </button>
    </div>

    <!-- Favoriten -->
    <div id="favoritenSection" style="margin-bottom:1rem"></div>

    <!-- Eigene Gerichte -->
    <div id="eigeneSection" style="margin-bottom:1rem"></div>

    <!-- Suchergebnisse -->
    <div id="searchResults"></div>
</div>
</div>

<!-- Modal: Zum Wochenplan hinzufügen -->
<div class="modal-overlay" id="addToPlanOverlay" onclick="if(event.target===this)closeAddToPlan()">
    <div class="modal" style="max-width:440px">
        <div class="modal-header">
            <h2 id="addToPlanTitle"><i class="bi bi-calendar-plus"></i> Zum Wochenplan</h2>
            <button class="modal-close" onclick="closeAddToPlan()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <p style="font-size:0.85rem;color:var(--gray-500);margin-bottom:0.75rem" id="addToPlanRecipeName"></p>

            <label style="font-size:0.8rem;font-weight:600;color:var(--gray-500)">Woche</label>
            <div class="week-nav" style="margin-bottom:0.75rem">
                <button class="btn btn-secondary btn-icon btn-sm" onclick="changePlanWeek(-1)"><i class="bi bi-chevron-left"></i></button>
                <span class="week-label" id="planWeekLabel" style="font-size:0.85rem;min-width:150px"></span>
                <button class="btn btn-secondary btn-icon btn-sm" onclick="changePlanWeek(1)"><i class="bi bi-chevron-right"></i></button>
            </div>

            <label style="font-size:0.8rem;font-weight:600;color:var(--gray-500)">Tag</label>
            <div class="day-picker" id="dayPicker"></div>

            <label style="font-size:0.8rem;font-weight:600;color:var(--gray-500)">Mahlzeit</label>
            <div class="meal-pick">
                <button class="meal-pick-btn selected" data-meal="mittag" onclick="selectMeal(this)"><i class="bi bi-sun"></i> Mittag</button>
                <button class="meal-pick-btn" data-meal="abend" onclick="selectMeal(this)"><i class="bi bi-moon"></i> Abend</button>
            </div>

            <label style="font-size:0.8rem;font-weight:600;color:var(--gray-500)">Personen</label>
            <div style="display:flex;gap:0.75rem;margin-bottom:1rem">
                <div style="display:flex;align-items:center;gap:0.3rem">
                    <label style="font-size:0.75rem;color:var(--gray-400);font-weight:600">Erwachsene</label>
                    <input type="number" id="planErw" value="2" min="0" max="20" style="width:50px;text-align:center;padding:0.3rem">
                </div>
                <div style="display:flex;align-items:center;gap:0.3rem">
                    <label style="font-size:0.75rem;color:var(--gray-400);font-weight:600">Kinder</label>
                    <input type="number" id="planKind" value="0" min="0" max="20" style="width:50px;text-align:center;padding:0.3rem">
                </div>
            </div>

            <div style="display:flex;gap:0.5rem;justify-content:flex-end">
                <button class="btn btn-secondary" onclick="closeAddToPlan()">Abbrechen</button>
                <button class="btn btn-primary" onclick="confirmAddToPlan()"><i class="bi bi-calendar-plus"></i> Hinzufügen</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Eigene Gerichte verwalten -->
<div class="modal-overlay" id="gerichteOverlay" onclick="if(event.target===this)closeGerichteModal()">
    <div class="modal" style="max-width:520px">
        <div class="modal-header">
            <h2><i class="bi bi-book"></i> Eigene Gerichte</h2>
            <button class="modal-close" onclick="closeGerichteModal()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body" id="gerichteBody"></div>
    </div>
</div>

<!-- Modal: Gericht bearbeiten -->
<div class="modal-overlay" id="gerichtEditOverlay" onclick="if(event.target===this)closeGerichtEdit()">
    <div class="modal" style="max-width:520px">
        <div class="modal-header">
            <h2 id="gerichtEditTitle"><i class="bi bi-book"></i> Neues Gericht</h2>
            <button class="modal-close" onclick="closeGerichtEdit()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="gerichtEditId">
            <div style="margin-bottom:0.75rem">
                <label for="gerichtEditName">Name</label>
                <input type="text" id="gerichtEditName" placeholder="z. B. Spaghetti Bolognese">
            </div>
            <div style="margin-bottom:0.5rem">
                <label>Zutaten</label>
                <div id="gerichtZutatenList"></div>
                <button type="button" class="btn btn-secondary btn-sm" onclick="addGerichtZutat()" style="margin-top:0.4rem">
                    <i class="bi bi-plus"></i> Weitere Zutat
                </button>
            </div>
            <div style="display:flex;gap:0.5rem;justify-content:space-between;margin-top:1rem">
                <button class="btn btn-danger" id="gerichtDeleteBtn" style="display:none">
                    <i class="bi bi-trash"></i> Löschen
                </button>
                <div style="display:flex;gap:0.5rem;margin-left:auto">
                    <button class="btn btn-secondary" onclick="closeGerichtEdit()">Abbrechen</button>
                    <button class="btn btn-primary" onclick="saveGericht()"><i class="bi bi-check-lg"></i> Speichern</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="loginScreen"></div>

<script src="lib/simplewebauthn-browser.min.js"></script>
<script src="webauthn.js"></script>
<script src="shared.js"></script>
<script src="layout.js"></script>
<script src="bugreport.js"></script>
<script src="rezepte.js"></script>
<script>initLayout({ loginIcon: 'bi-book', extraMenu: '<button onclick="openGerichteModal();closeNavDropdown()"><i class="bi bi-book"></i> Eigene Gerichte</button>' });</script>

</body>
</html>
