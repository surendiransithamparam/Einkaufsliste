<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Rezepte – Einkaufsliste</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="wochenplan.css">
    <style>
        .recipe-card {
            background: var(--surface);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: box-shadow 0.15s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .recipe-card:hover { box-shadow: var(--shadow-md); }
        .recipe-card a:hover { color: var(--green-600); }
        .recipe-card .source-badge {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--gray-400);
            background: var(--gray-100);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            white-space: nowrap;
        }
        .recipe-grid { display: flex; flex-direction: column; gap: 0.5rem; }
        .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .search-box input { flex: 1; }
        .day-picker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; margin-bottom: 0.75rem; }
        .day-pick-btn {
            padding: 0.4rem 0.2rem;
            border: 1.5px solid var(--gray-200);
            border-radius: 6px;
            background: var(--surface);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--gray-500);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .day-pick-btn:hover { border-color: var(--green-600); color: var(--green-600); }
        .day-pick-btn.selected { background: var(--green-600); color: white; border-color: var(--green-600); }
        .day-pick-btn .day-date { font-size: 0.6rem; font-weight: 400; display: block; }
        .meal-pick { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .meal-pick-btn {
            flex: 1;
            padding: 0.5rem;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            background: var(--surface);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray-500);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .meal-pick-btn:hover { border-color: var(--green-600); color: var(--green-600); }
        .meal-pick-btn.selected { background: var(--green-600); color: white; border-color: var(--green-600); }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-left"></div>
    <div class="navbar-center">
        <a href="index.html" class="nav-tab" title="Einkaufsliste">
            <i class="bi bi-cart3"></i>
            <span>Einkauf</span>
        </a>
        <a href="wochenplan.html" class="nav-tab" title="Wochenplan">
            <i class="bi bi-calendar-week"></i>
            <span>Woche</span>
        </a>
        <a href="rezepte.html" class="nav-tab active" title="Rezepte">
            <i class="bi bi-book"></i>
            <span>Rezepte</span>
        </a>
        <a href="tankrabatte.html" class="nav-tab" title="Tankrabatte">
            <i class="bi bi-fuel-pump"></i>
            <span>Tanken</span>
        </a>
    </div>
    <div class="navbar-right">
        <div class="nav-dropdown" id="navDropdown">
            <button class="btn-nav btn-nav-icon" onclick="toggleNavDropdown(event)" title="Menü">
                <i class="bi bi-three-dots-vertical"></i>
            </button>
            <div class="nav-dropdown-menu" id="navDropdownMenu">
                <button onclick="openGerichteModal();closeNavDropdown()">
                    <i class="bi bi-book"></i> Eigene Gerichte
                </button>
                <button onclick="openHaushalt();closeNavDropdown()" id="haushaltBtn" style="display:none">
                    <i class="bi bi-people"></i> Haushalt
                </button>
                <button onclick="openProfil();closeNavDropdown()" id="profilBtn" style="display:none">
                    <i class="bi bi-person"></i> Profil
                </button>
                <button onclick="logout();closeNavDropdown()" id="logoutBtn" style="display:none">
                    <i class="bi bi-box-arrow-left"></i> Abmelden
                </button>
                <button onclick="openBugReport();closeNavDropdown()">
                    <i class="bi bi-bug"></i> Bug melden
                </button>
                <a href="about.html" style="text-decoration:none">
                    <i class="bi bi-info-circle"></i> Über
                </a>
            </div>
        </div>
    </div>
</nav>

<div id="appContent" class="app-content hidden">
<div class="container">
    <div class="search-box">
        <input type="text" id="rezeptSuche" placeholder="Rezept suchen…" onkeydown="if(event.key==='Enter')searchRecipes()">
        <button class="btn btn-primary" onclick="searchRecipes()" style="white-space:nowrap">
            <i class="bi bi-search"></i> Suchen
        </button>
    </div>

    <!-- Favoriten -->
    <div id="favoritenSection" style="margin-bottom:1rem"></div>

    <!-- Eigene Gerichte -->
    <div id="eigeneSection" style="margin-bottom:1rem"></div>

    <!-- Suchergebnisse -->
    <div id="searchResults"></div>
</div>
</div>

<!-- Modal: Zum Wochenplan hinzufügen -->
<div class="modal-overlay" id="addToPlanOverlay" onclick="if(event.target===this)closeAddToPlan()">
    <div class="modal" style="max-width:440px">
        <div class="modal-header">
            <h2 id="addToPlanTitle"><i class="bi bi-calendar-plus"></i> Zum Wochenplan</h2>
            <button class="modal-close" onclick="closeAddToPlan()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <p style="font-size:0.85rem;color:var(--gray-500);margin-bottom:0.75rem" id="addToPlanRecipeName"></p>

            <label style="font-size:0.8rem;font-weight:600;color:var(--gray-500)">Woche</label>
            <div class="week-nav" style="margin-bottom:0.75rem">
                <button class="btn btn-secondary btn-icon btn-sm" onclick="changePlanWeek(-1)"><i class="bi bi-chevron-left"></i></button>
                <span class="week-label" id="planWeekLabel" style="font-size:0.85rem;min-width:150px"></span>
                <button class="btn btn-secondary btn-icon btn-sm" onclick="changePlanWeek(1)"><i class="bi bi-chevron-right"></i></button>
            </div>

            <label style="font-size:0.8rem;font-weight:600;color:var(--gray-500)">Tag</label>
            <div class="day-picker" id="dayPicker"></div>

            <label style="font-size:0.8rem;font-weight:600;color:var(--gray-500)">Mahlzeit</label>
            <div class="meal-pick">
                <button class="meal-pick-btn selected" data-meal="mittag" onclick="selectMeal(this)"><i class="bi bi-sun"></i> Mittag</button>
                <button class="meal-pick-btn" data-meal="abend" onclick="selectMeal(this)"><i class="bi bi-moon"></i> Abend</button>
            </div>

            <label style="font-size:0.8rem;font-weight:600;color:var(--gray-500)">Personen</label>
            <div style="display:flex;gap:0.75rem;margin-bottom:1rem">
                <div style="display:flex;align-items:center;gap:0.3rem">
                    <label style="font-size:0.75rem;color:var(--gray-400);font-weight:600">Erwachsene</label>
                    <input type="number" id="planErw" value="2" min="0" max="20" style="width:50px;text-align:center;padding:0.3rem">
                </div>
                <div style="display:flex;align-items:center;gap:0.3rem">
                    <label style="font-size:0.75rem;color:var(--gray-400);font-weight:600">Kinder</label>
                    <input type="number" id="planKind" value="0" min="0" max="20" style="width:50px;text-align:center;padding:0.3rem">
                </div>
            </div>

            <div style="display:flex;gap:0.5rem;justify-content:flex-end">
                <button class="btn btn-secondary" onclick="closeAddToPlan()">Abbrechen</button>
                <button class="btn btn-primary" onclick="confirmAddToPlan()"><i class="bi bi-calendar-plus"></i> Hinzufügen</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Eigene Gerichte verwalten -->
<div class="modal-overlay" id="gerichteOverlay" onclick="if(event.target===this)closeGerichteModal()">
    <div class="modal" style="max-width:520px">
        <div class="modal-header">
            <h2><i class="bi bi-book"></i> Eigene Gerichte</h2>
            <button class="modal-close" onclick="closeGerichteModal()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body" id="gerichteBody"></div>
    </div>
</div>

<!-- Modal: Gericht bearbeiten -->
<div class="modal-overlay" id="gerichtEditOverlay" onclick="if(event.target===this)closeGerichtEdit()">
    <div class="modal" style="max-width:520px">
        <div class="modal-header">
            <h2 id="gerichtEditTitle"><i class="bi bi-book"></i> Neues Gericht</h2>
            <button class="modal-close" onclick="closeGerichtEdit()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="gerichtEditId">
            <div style="margin-bottom:0.75rem">
                <label for="gerichtEditName">Name</label>
                <input type="text" id="gerichtEditName" placeholder="z. B. Spaghetti Bolognese">
            </div>
            <div style="margin-bottom:0.5rem">
                <label>Zutaten</label>
                <div id="gerichtZutatenList"></div>
                <button type="button" class="btn btn-secondary btn-sm" onclick="addGerichtZutat()" style="margin-top:0.4rem">
                    <i class="bi bi-plus"></i> Weitere Zutat
                </button>
            </div>
            <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:1rem">
                <button class="btn btn-secondary" onclick="closeGerichtEdit()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveGericht()"><i class="bi bi-check-lg"></i> Speichern</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Profil -->
<div class="modal-overlay" id="profilOverlay" onclick="if(event.target===this)closeProfil()">
    <div class="modal" style="max-width:420px">
        <div class="modal-header">
            <h2><i class="bi bi-person"></i> Profil</h2>
            <button class="modal-close" onclick="closeProfil()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <div style="margin-bottom:0.75rem">
                <label>Benutzername</label>
                <input type="text" id="profilUser" disabled style="background:var(--gray-100);color:var(--gray-500)">
            </div>
            <div style="margin-bottom:1rem">
                <label for="profilEmail">E-Mail</label>
                <input type="email" id="profilEmail" placeholder="name@beispiel.ch">
            </div>
            <div style="display:flex;gap:0.5rem;justify-content:flex-end">
                <button class="btn btn-secondary" onclick="closeProfil()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveProfil()"><i class="bi bi-check-lg"></i> Speichern</button>
            </div>
        </div>
    </div>
</div>

<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-book" style="font-size:2.5rem;color:var(--green-600)"></i>
            <h1 style="font-size:1.5rem;margin-top:0.5rem">Rezepte</h1>
            <p style="color:var(--gray-500);font-size:0.85rem;margin-top:0.25rem">Anmelden</p>
        </div>
        <form onsubmit="submitAuth(event)">
            <div style="display:flex;flex-direction:column;gap:0.75rem">
                <div>
                    <label for="authUser">Benutzername</label>
                    <input type="text" id="authUser" required autocomplete="username" placeholder="Benutzername">
                </div>
                <div>
                    <label for="authPass">Passwort</label>
                    <input type="password" id="authPass" required autocomplete="current-password" placeholder="Passwort">
                </div>
                <div id="authError" style="display:none;color:var(--red-500);font-size:0.8rem;font-weight:500"></div>
                <div id="authSuccess" style="display:none;color:var(--green-600);font-size:0.8rem;font-weight:500"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:0.7rem;font-size:0.95rem">
                    <i class="bi bi-box-arrow-in-right"></i> Anmelden
                </button>
                <a href="register.html" class="btn btn-secondary" style="width:100%;padding:0.7rem;font-size:0.95rem;text-decoration:none;text-align:center">
                    <i class="bi bi-person-plus"></i> Registrieren
                </a>
            </div>
        </form>
    </div>
</div>

<div class="toast-container" id="toasts"></div>

<script src="shared.js"></script>
<script src="bugreport.js"></script>
<script src="rezepte.js"></script>

</body>
</html>
