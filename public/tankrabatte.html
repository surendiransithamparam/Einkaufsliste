<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>Tankrabatte</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="tankrabatte.css">
</head>
<body>

<nav class="navbar">
    <div class="navbar-left"></div>
    <div class="navbar-center">
        <a href="index.html" class="nav-tab" title="Einkaufsliste">
            <i class="bi bi-cart3"></i>
            <span>Einkauf</span>
        </a>
        <a href="wochenplan.html" class="nav-tab" title="Wochenplan">
            <i class="bi bi-calendar-week"></i>
            <span>Woche</span>
        </a>
        <a href="rezepte.html" class="nav-tab" title="Rezepte">
            <i class="bi bi-book"></i>
            <span>Rezepte</span>
        </a>
        <a href="tankrabatte.html" class="nav-tab active" title="Tankrabatte">
            <i class="bi bi-fuel-pump"></i>
            <span>Tanken</span>
        </a>
    </div>
    <div class="navbar-right">
        <div class="nav-dropdown" id="navDropdown">
            <button class="btn-nav btn-nav-icon" onclick="toggleNavDropdown(event)" title="Menü">
                <i class="bi bi-three-dots-vertical"></i>
            </button>
            <div class="nav-dropdown-menu" id="navDropdownMenu">
                <button onclick="openHaushalt();closeNavDropdown()" id="haushaltBtn" style="display:none">
                    <i class="bi bi-people"></i> Haushalt
                </button>
                <button onclick="openProfil();closeNavDropdown()" id="profilBtn" style="display:none">
                    <i class="bi bi-person"></i> Profil
                </button>
                <button onclick="logout();closeNavDropdown()" id="logoutBtn" style="display:none">
                    <i class="bi bi-box-arrow-left"></i> Abmelden
                </button>
                <button onclick="openBugReport();closeNavDropdown()">
                    <i class="bi bi-bug"></i> Bug melden
                </button>
                <a href="about.html" style="text-decoration:none">
                    <i class="bi bi-info-circle"></i> Über
                </a>
            </div>
        </div>
    </div>
</nav>

<div id="appContent" class="app-content hidden">
<div class="container">
    <h2 style="font-size:1.1rem;margin-bottom:1rem;display:flex;align-items:center;gap:0.4rem">
        <i class="bi bi-fuel-pump" style="color:var(--green-600)"></i> Aktuelle Tankrabatte
    </h2>

    <div id="tankrabatteLoading" style="text-align:center;padding:2rem;color:var(--gray-400)">
        <i class="bi bi-arrow-repeat spin" style="font-size:1.5rem"></i>
        <p style="margin-top:0.5rem">Gutscheine werden geladen...</p>
    </div>

    <div id="tankrabatteContent" style="display:none">
        <!-- Coop Pronto -->
        <div class="anbieter-section" id="sectionCoopPronto">
            <div class="anbieter-header">
                <span class="anbieter-name">Coop Pronto</span>
                <span class="anbieter-badge" id="badgeCoopPronto">0</span>
            </div>
            <div class="gutschein-liste" id="listeCoopPronto"></div>
        </div>

        <!-- Migrol -->
        <div class="anbieter-section" id="sectionMigrol">
            <div class="anbieter-header">
                <span class="anbieter-name">Migrol</span>
                <span class="anbieter-badge" id="badgeMigrol">0</span>
            </div>
            <div class="gutschein-liste" id="listeMigrol"></div>
        </div>

        <!-- Shell -->
        <div class="anbieter-section" id="sectionShell">
            <div class="anbieter-header">
                <span class="anbieter-name">Shell</span>
                <span class="anbieter-badge" id="badgeShell">0</span>
            </div>
            <div class="gutschein-liste" id="listeShell"></div>
        </div>

        <!-- AVIA -->
        <div class="anbieter-section" id="sectionAvia">
            <div class="anbieter-header">
                <span class="anbieter-name">AVIA</span>
                <span class="anbieter-badge" id="badgeAvia">0</span>
            </div>
            <div class="gutschein-liste" id="listeAvia"></div>
        </div>
    </div>

    <div id="tankrabatteError" style="display:none;text-align:center;padding:2rem;color:var(--red-500)">
        <i class="bi bi-exclamation-triangle" style="font-size:1.5rem"></i>
        <p style="margin-top:0.5rem" id="tankrabatteErrorMsg">Fehler beim Laden.</p>
        <button class="btn btn-secondary btn-sm" onclick="ladeGutscheine()" style="margin-top:0.75rem">
            <i class="bi bi-arrow-clockwise"></i> Erneut versuchen
        </button>
    </div>

    <div id="tankrabatteFooter" style="display:none;text-align:center;margin-top:1.5rem">
        <button class="btn btn-secondary btn-sm" onclick="ladeGutscheine()">
            <i class="bi bi-arrow-clockwise"></i> Aktualisieren
        </button>
        <p style="font-size:0.7rem;color:var(--gray-400);margin-top:0.5rem" id="letzteAktualisierung"></p>
    </div>
</div>
</div>

<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-fuel-pump" style="font-size:2.5rem;color:var(--green-600)"></i>
            <h1 style="font-size:1.5rem;margin-top:0.5rem">Tankrabatte</h1>
            <p style="color:var(--gray-500);font-size:0.85rem;margin-top:0.25rem">Anmelden</p>
        </div>
        <form onsubmit="submitAuth(event)">
            <div style="display:flex;flex-direction:column;gap:0.75rem">
                <div>
                    <label for="authUser">Benutzername</label>
                    <input type="text" id="authUser" required autocomplete="username" placeholder="Benutzername">
                </div>
                <div>
                    <label for="authPass">Passwort</label>
                    <input type="password" id="authPass" required autocomplete="current-password" placeholder="Passwort">
                </div>
                <div id="authError" style="display:none;color:var(--red-500);font-size:0.8rem;font-weight:500"></div>
                <div id="authSuccess" style="display:none;color:var(--green-600);font-size:0.8rem;font-weight:500"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:0.7rem;font-size:0.95rem">
                    <i class="bi bi-box-arrow-in-right"></i> Anmelden
                </button>
                <a href="register.html" class="btn btn-secondary" style="width:100%;padding:0.7rem;font-size:0.95rem;text-decoration:none;text-align:center">
                    <i class="bi bi-person-plus"></i> Registrieren
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Profil -->
<div class="modal-overlay" id="profilOverlay" onclick="if(event.target===this)closeProfil()">
    <div class="modal" style="max-width:420px">
        <div class="modal-header">
            <h2><i class="bi bi-person"></i> Profil</h2>
            <button class="modal-close" onclick="closeProfil()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <div style="margin-bottom:0.75rem">
                <label>Benutzername</label>
                <input type="text" id="profilUser" disabled style="background:var(--gray-100);color:var(--gray-500)">
            </div>
            <div style="margin-bottom:1rem">
                <label for="profilEmail">E-Mail</label>
                <input type="email" id="profilEmail" placeholder="name@beispiel.ch">
            </div>
            <div style="display:flex;gap:0.5rem;justify-content:flex-end">
                <button class="btn btn-secondary" onclick="closeProfil()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveProfil()"><i class="bi bi-check-lg"></i> Speichern</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toasts"></div>

<script src="shared.js"></script>
<script src="bugreport.js"></script>
<script src="tankrabatte.js"></script>
</body>
</html>
