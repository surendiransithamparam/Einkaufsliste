<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>Haushalt+</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="wochenplan.css">
</head>
<body>

<nav id="navbar"></nav>
<aside id="sidebar"></aside>

<div id="appContent" class="app-content hidden">
<div class="container">
    <!-- Week Navigation -->
    <div class="week-nav">
        <button class="btn btn-secondary btn-icon" onclick="changeWeek(-1)"><i class="bi bi-chevron-left"></i></button>
        <span class="week-label" id="weekLabel"></span>
        <button class="btn btn-secondary btn-icon" onclick="changeWeek(1)"><i class="bi bi-chevron-right"></i></button>
        <button class="btn btn-secondary btn-sm" onclick="goToday()" style="margin-left:0.5rem">Heute</button>
    </div>

    <!-- Plan Grid -->
    <div class="plan-grid" id="planGrid"></div>
</div>
</div>

<div id="loginScreen"></div>

<!-- Modal: Rezept-Zutaten -->
<div class="modal-overlay" id="dishSearchOverlay" onclick="if(event.target===this)closeDishSearch()">
    <div class="modal" style="max-width:520px">
        <div class="modal-header">
            <h2 id="dishSearchTitle"><i class="bi bi-cart-plus"></i> Zutaten</h2>
            <button class="modal-close" onclick="closeDishSearch()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body" id="dishSearchBody">
        </div>
    </div>
</div>

<!-- Modal: Eigene Gerichte verwalten -->
<div class="modal-overlay" id="gerichteOverlay" onclick="if(event.target===this)closeGerichteModal()">
    <div class="modal" style="max-width:520px">
        <div class="modal-header">
            <h2><i class="bi bi-book"></i> Eigene Gerichte</h2>
            <button class="modal-close" onclick="closeGerichteModal()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body" id="gerichteBody">
        </div>
    </div>
</div>

<!-- Modal: Gericht bearbeiten -->
<div class="modal-overlay" id="gerichtEditOverlay" onclick="if(event.target===this)closeGerichtEdit()">
    <div class="modal" style="max-width:520px">
        <div class="modal-header">
            <h2 id="gerichtEditTitle"><i class="bi bi-book"></i> Neues Gericht</h2>
            <button class="modal-close" onclick="closeGerichtEdit()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="gerichtEditId">
            <div style="margin-bottom:0.75rem">
                <label for="gerichtEditName">Name</label>
                <input type="text" id="gerichtEditName" placeholder="z. B. Spaghetti Bolognese">
            </div>
            <div style="margin-bottom:0.5rem">
                <label>Zutaten</label>
                <div id="gerichtZutatenList"></div>
                <button type="button" class="btn btn-secondary btn-sm" onclick="addGerichtZutat()" style="margin-top:0.4rem">
                    <i class="bi bi-plus"></i> Weitere Zutat
                </button>
            </div>
            <div style="display:flex;gap:0.5rem;justify-content:space-between;margin-top:1rem">
                <button class="btn btn-danger" id="gerichtDeleteBtn" style="display:none">
                    <i class="bi bi-trash"></i> Löschen
                </button>
                <div style="display:flex;gap:0.5rem;margin-left:auto">
                    <button class="btn btn-secondary" onclick="closeGerichtEdit()">Abbrechen</button>
                    <button class="btn btn-primary" onclick="saveGericht()"><i class="bi bi-check-lg"></i> Speichern</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="lib/simplewebauthn-browser.min.js"></script>
<script src="webauthn.js"></script>
<script src="shared.js"></script>
<script src="layout.js"></script>
<script src="bugreport.js"></script>
<script src="wochenplan.js"></script>
<script>initLayout({ loginIcon: 'bi-calendar-week', extraMenu: '<button onclick="openGerichteModal();closeNavDropdown()"><i class="bi bi-book"></i> Eigene Gerichte</button>' });</script>
</body>
</html>
