<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Haushalt+">
    <title>Haushalt+</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link rel="stylesheet" href="app.css">

    <!-- Barcode libraries -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>

<nav id="navbar"></nav>
<aside id="sidebar"></aside>

<div id="appContent" class="app-content hidden">
<div class="container">

    <h2 style="font-size:1.1rem;margin-bottom:0.75rem;display:flex;align-items:center;gap:0.4rem">
        <i class="bi bi-credit-card" style="color:var(--green-600)"></i> Kundenkarten
    </h2>

    <div id="kartenFilterCard" style="display:none;margin-bottom:0.75rem">
        <div class="filter-bar">
            <input type="text" id="kartenSearch" placeholder="Karte suchen…" oninput="renderKarten()">
        </div>
    </div>

    <div id="kartenGrid" class="tile-grid"></div>

    <div id="kartenEmpty" style="display:none;text-align:center;padding:2rem 1rem;color:var(--gray-400)">
        <i class="bi bi-credit-card" style="font-size:2.5rem;display:block;margin-bottom:0.5rem"></i>
        <p>Noch keine Kundenkarten hinterlegt.</p>
        <p style="font-size:0.8rem">Tippe auf + um eine Karte hinzuzufügen.</p>
    </div>

    <!-- FAB -->
    <button class="fab" onclick="openAddKarte()" title="Neue Kundenkarte" aria-label="Neue Kundenkarte">
        <i class="bi bi-plus-lg"></i>
    </button>

</div>
</div>

<!-- Barcode Fullscreen Overlay -->
<div class="modal-overlay" id="barcodeOverlay" onclick="if(event.target===this)closeBarcodeOverlay()" style="background:rgba(0,0,0,0.85)">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:2rem;text-align:center">
        <div id="barcodeKarteLogo" style="margin-bottom:0.75rem"></div>
        <div style="font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:0.5rem" id="barcodeKarteName"></div>
        <div id="barcodeKarteNotiz" style="font-size:0.85rem;color:rgba(255,255,255,0.6);margin-bottom:1.5rem"></div>
        <div style="background:#fff;border-radius:12px;padding:1.5rem 2rem;margin-bottom:1rem">
            <svg id="barcodeDisplay"></svg>
            <canvas id="qrcodeDisplay" style="display:none"></canvas>
        </div>
        <div id="barcodeKarteNummer" style="display:none"></div>
        <button class="btn btn-secondary" onclick="closeBarcodeOverlay()" style="color:#fff;border-color:rgba(255,255,255,0.3)">
            <i class="bi bi-x-lg"></i> Schliessen
        </button>
    </div>
</div>

<!-- Modal: Karte hinzufügen/bearbeiten -->
<div class="modal-overlay" id="karteOverlay" onclick="if(event.target===this)closeKarteModal()">
    <div class="modal" style="max-width:420px">
        <div class="modal-header">
            <h2 id="karteModalTitle"><i class="bi bi-credit-card"></i> Neue Kundenkarte</h2>
            <button class="modal-close" onclick="closeKarteModal()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="karteEditId">
            <div style="margin-bottom:0.75rem">
                <label for="karteName">Name</label>
                <input type="text" id="karteName" placeholder="z.B. Migros Cumulus" maxlength="200">
            </div>
            <div style="margin-bottom:0.75rem">
                <label for="karteNummer">Kartennummer</label>
                <div style="display:flex;gap:0.5rem">
                    <input type="text" id="karteNummer" placeholder="z.B. 76 1234 5678 9" maxlength="500" style="flex:1" oninput="previewKarteValidation()">
                    <button class="btn btn-secondary btn-icon" onclick="startScan()" title="Barcode scannen" style="width:44px;height:44px;flex-shrink:0">
                        <i class="bi bi-upc-scan"></i>
                    </button>
                </div>
                <div id="scannerContainer" style="display:none;margin-top:0.5rem;border-radius:var(--radius-sm);overflow:hidden">
                    <div id="scannerView" style="width:100%"></div>
                    <button class="btn btn-secondary btn-sm" onclick="stopScan()" style="width:100%;margin-top:0.25rem">
                        <i class="bi bi-x-lg"></i> Scanner schliessen
                    </button>
                </div>
            </div>
            <div id="karteNummerWarning" style="display:none;color:var(--yellow-600,#ca8a04);font-size:0.75rem;font-weight:500;margin-top:0.25rem;margin-bottom:0.5rem">
                <i class="bi bi-exclamation-triangle"></i> <span id="karteNummerWarningText"></span>
            </div>
            <div style="margin-bottom:1rem">
                <label for="karteNotiz">Notiz (optional)</label>
                <input type="text" id="karteNotiz" placeholder="z.B. Familie" maxlength="500">
            </div>
            <div id="karteError" style="display:none;color:var(--red-500);font-size:0.8rem;font-weight:500;margin-bottom:0.75rem"></div>
            <div style="display:flex;gap:0.5rem;justify-content:space-between">
                <button class="btn btn-danger" id="karteModalDeleteBtn" style="display:none">
                    <i class="bi bi-trash"></i> Löschen
                </button>
                <div style="display:flex;gap:0.5rem;margin-left:auto">
                    <button class="btn btn-secondary" onclick="closeKarteModal()">Abbrechen</button>
                    <button class="btn btn-primary" onclick="saveKarte()"><i class="bi bi-check-lg"></i> Speichern</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirm -->
<div class="modal-overlay" id="deleteOverlay" onclick="if(event.target===this)closeDeleteConfirm()">
    <div class="modal" style="max-width:360px">
        <div class="modal-header">
            <h2><i class="bi bi-trash"></i> Karte löschen</h2>
            <button class="modal-close" onclick="closeDeleteConfirm()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <p style="margin-bottom:1rem">Möchtest du diese Kundenkarte wirklich löschen?</p>
            <div style="display:flex;gap:0.5rem;justify-content:flex-end">
                <button class="btn btn-secondary" onclick="closeDeleteConfirm()">Abbrechen</button>
                <button class="btn btn-danger" onclick="confirmDelete()"><i class="bi bi-trash"></i> Löschen</button>
            </div>
        </div>
    </div>
</div>

<!-- Login Screen -->
<div id="loginScreen"></div>

<script src="lib/simplewebauthn-browser.min.js"></script>
<script src="webauthn.js"></script>
<script src="shared.js"></script>
<script src="layout.js"></script>
<script src="bugreport.js"></script>
<script src="kundenkarten.js"></script>
<script>initLayout({ loginIcon: 'bi-credit-card' });</script>

</body>
</html>
